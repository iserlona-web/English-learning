                function switchPage(pageId) {
                    document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
                    document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
                    document.getElementById(pageId + '-page').classList.add('active');
                    document.getElementById('nav-' + pageId).classList.add('active');
                }

                function speak(t) {
                    window.speechSynthesis.cancel();
                    const m = new SpeechSynthesisUtterance(t);
                    m.lang = 'en-US';
                    window.speechSynthesis.speak(m);
                }

                function filterWords() {
                    const val = document.getElementById('dateSelect').value;
                    const container = document.getElementById('card-container');
                    container.innerHTML = "";
                    words.forEach(w => {
                        if (val === "all" || w.日期 === val) {
                            const div = document.createElement('div');
                            div.className = 'word-card';
                            div.onclick = () => speak(w.單字);
                            div.innerHTML = `
                                <div style="display:flex; justify-content:space-between; font-size:0.7rem; color:#bbb; margin-bottom:5px;">
                                    <span style="background:#e8f0fe; color:var(--primary); padding:2px 6px; border-radius:10px; font-weight:bold;">No. ${w.序號}</span>
                                    <span>Box ${w.Box}</span>
                                </div>
                                <div class="en">${w.單字}</div>
                                <div class="zh">${w.中文}</div>
                                ${w.小秘訣 ? `<div class="hint">💡 ${w.小秘訣}</div>` : ''}
                            `;
                            container.appendChild(div);
                        }
                    });
                }

                // --- 測驗相關變數 ---
                let quizQueue = [], currentIdx = 0, results = [], isChecking = true;

                function startQuiz() {
                    const today = new Date();
                    const amount = document.getElementById('quizAmount').value;
                    let pool = words.filter(w => {
                        const last = new Date(w.LastDate);
                        const diff = Math.floor((today - last) / 86400000);
                        if (w.Box == 1) return true;
                        if (w.Box == 2) return diff >= 3;
                        if (w.Box == 3) return diff >= 7;
                        if (w.Box == 4) return diff >= 30;
                        if (w.Box == 5) return diff >= 365;
                        return false;
                    }).sort(() => Math.random() - 0.5);

                    if (amount !== "all") pool = pool.slice(0, parseInt(amount));
                    if (pool.length === 0) return alert("目前沒有需要複習的單字！");
                    
                    quizQueue = pool;
                    document.getElementById('quiz-start-ui').style.display = 'none';
                    document.getElementById('quiz-run-ui').style.display = 'block';
                    showQuestion();
                }

                function showQuestion() {
                    const q = quizQueue[currentIdx];
                    document.getElementById('quiz-progress').innerText = `題號：${currentIdx+1} / ${quizQueue.length}`;
                    document.getElementById('quiz-zh').innerText = q.中文;
                    const input = document.getElementById('quiz-input');
                    input.value = ""; input.disabled = false; input.focus();
                    document.getElementById('quiz-feedback').innerText = "";
                    document.getElementById('quiz-hint').style.display = "none";
                    document.getElementById('quiz-btn').innerText = "送出答案";
                    isChecking = true;
                    speak(q.單字);
                }

                function handleQuizAction() {
                    if (isChecking) {
                        const q = quizQueue[currentIdx];
                        const ans = document.getElementById('quiz-input').value.trim().toLowerCase();
                        const correct = ans === q.單字.toLowerCase();
                        let newBox = correct ? Math.min(q.Box + 1, 5) : 1;
                        results.push({ no: q.序號, newBox: newBox });
                        
                        document.getElementById('quiz-input').disabled = true;
                        const feedback = document.getElementById('quiz-feedback');
                        if (correct) {
                            feedback.innerText = "✅ 正確！"; feedback.style.color = "var(--success)";
                        } else {
                            feedback.innerText = "❌ 正確答案：" + q.單字; feedback.style.color = "var(--danger)";
                            if(q.小秘訣) {
                                document.getElementById('quiz-hint').innerText = "💡 " + q.小秘訣;
                                document.getElementById('quiz-hint').style.display = "block";
                            }
                        }
                        document.getElementById('quiz-btn').innerText = "下一題";
                        isChecking = false;
                    } else {
                        currentIdx++;
                        if (currentIdx < quizQueue.length) showQuestion();
                        else finishQuiz();
                    }
                }

                function finishQuiz() {
                    const blob = new Blob([JSON.stringify(results)], { type: "application/json" });
                    const url = URL.createObjectURL(blob);
                    const a = document.createElement("a");
                    a.href = url; a.download = "study_progress.json";
                    document.body.appendChild(a); a.click();
                    alert("測驗完成！進度檔已下載，請同步回 Excel。");
                    location.reload();
                }

                // --- 頁面初始化執行 ---
                function init() {
                    // 1. 顯示統計
                    const statsArea = document.getElementById('stats-area');
                    [1,2,3,4,5].forEach(b => {
                        const count = words.filter(w => w.Box == b).length;
                        statsArea.innerHTML += `<span class="box-tag b${b}">B${b}: ${count}</span>`;
                    });

                    // 2. 自動設定今日日期
                    const dateSelect = document.getElementById('dateSelect');
                    const now = new Date();
                    const todayStr = `${now.getFullYear()}/${now.getMonth() + 1}/${now.getDate()}`;
                    
                    let hasToday = false;
                    for (let i = 0; i < dateSelect.options.length; i++) {
                        if (dateSelect.options[i].value === todayStr) {
                            dateSelect.value = todayStr;
                            hasToday = true;
                            break;
                        }
                    }
                    if (!hasToday) dateSelect.value = "all";
                    
                    // 3. 執行初始過濾
                    filterWords();
                }

                window.onload = init;
            </script>
