                function speak(text) {
                    window.speechSynthesis.cancel();
                    const msg = new SpeechSynthesisUtterance(text);
                    msg.lang = 'en-US';
                    msg.rate = 0.8;
                    window.speechSynthesis.speak(msg);
                }

                function filterWords() {
                    const selectedDate = document.getElementById('dateSelect').value;
                    const container = document.getElementById('container');
                    container.innerHTML = "";

                    words.forEach(item => {
                        if (selectedDate === "all" || String(item.日期) === selectedDate) {
                            const card = document.createElement('div');
                            card.className = 'word-card';
                            card.onclick = () => speak(item.單字);
                            card.innerHTML = `
                                <div class="header">
                                    <span class="no">No. ${item.序號}</span>
                                    <span style="font-size: 0.7rem; color: #bbb;">${item.日期}</span>

                                <div class="en">${item.單字}</div>

                                ${item.小秘訣 ? `<div class="hint">💡 ${item.小秘訣}</div>` : ''}
                            `;
                            container.appendChild(card);
                        }
                    });
                }
