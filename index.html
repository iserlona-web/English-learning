                const dateSelect = document.getElementById('dateSelect');
                const container = document.getElementById('container');

                function speak(text) {
                    window.speechSynthesis.cancel();
                    const msg = new SpeechSynthesisUtterance(text);
                    msg.lang = 'en-US';
                    msg.rate = 0.8;
                    window.speechSynthesis.speak(msg);
                }

                function filterWords() {
                    const selectedDate = dateSelect.value;
                    container.innerHTML = "";

                    words.forEach(item => {
                        if (selectedDate === "all" || String(item.日期) === selectedDate) {
                            const card = document.createElement('div');
                            card.className = 'word-card';
                            card.onclick = () => speak(item.單字);
                            card.innerHTML = `
                                <div class="header">
                                    <span class="no">No. ${item.序號}</span>
                                    <span style="font-size: 0.7rem; color: #bbb;">${item.日期}</span>
                                </div>
                                <div class="en">${item.單字}</div>
                                <div class="zh">${item.中文}</div>
                                ${item.小秘訣 ? `<div class="hint">💡 ${item.小秘訣}</div>` : ''}
                            `;
                            container.appendChild(card);
                        }
                    });
                }

                function setAutoDate() {
                    const today = new Date();
                    const dateStr = `${today.getFullYear()}/${today.getMonth() + 1}/${today.getDate()}`;
                    
                    let hasToday = false;
                    for (let i = 0; i < dateSelect.options.length; i++) {
                        if (dateSelect.options[i].value === dateStr) {
                            dateSelect.value = dateStr;
                            hasToday = true;
                            break;
                        }
                    }
                    if (!hasToday) dateSelect.value = "all";
                    filterWords();
                }

                setAutoDate();
            </script>
